    <style>
        /* Base Variables for Theming */
        :root {
            --bg-color: #f8fafc;
            --card-bg-color: #ffffff;
            --text-color: #1e293b;
            --text-muted-color: #64748b;
            --item-bg-color: #f1f5f9;
            --item-hover-bg-color: #e2e8f0;
            --border-color: #e2e8f0;
            --active-btn-bg: #10b981;
            --active-btn-text: #ffffff;
            --error-btn-bg: #ef4444;
        }

        .dark {
            --bg-color: #1e293b;
            --card-bg-color: #334155;
            --text-color: #f1f5f9;
            --text-muted-color: #94a3b8;
            --item-bg-color: #475569;
            --item-hover-bg-color: #64748b;
            --border-color: #475569;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 6rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .card { background-color: var(--card-bg-color); }
        .text-muted { color: var(--text-muted-color); }

        .checklist-item {
            background-color: var(--item-bg-color);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        
        .checklist-item.completed {
            background-color: var(--item-hover-bg-color);
            border-left: 4px solid var(--active-btn-bg);
        }
        
        .nav-button.active { background-color: #059669; color: white; border-color: #059669; }
        .progress-bar-fill { transition: width 0.5s ease-in-out; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); z-index: 1000; }
        .modal-content { z-index: 1001; }
        
        /* Custom Input Styles */
        .option-btn {
            background-color: transparent;
            border: 1px solid var(--text-muted-color);
            color: var(--text-muted-color);
            transition: all 0.2s;
        }
        .option-btn:hover { background-color: rgba(0,0,0,0.05); }
        .option-btn.selected-good {
            background-color: var(--active-btn-bg);
            color: white;
            border-color: var(--active-btn-bg);
        }
        .option-btn.selected-bad {
            background-color: var(--error-btn-bg);
            color: white;
            border-color: var(--error-btn-bg);
        }
        .option-btn.selected-neutral {
            background-color: var(--text-muted-color);
            color: white;
            border-color: var(--text-muted-color);
        }
        
        input[type="number"], input[type="text"] {
            background-color: var(--card-bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* Photo Styles */
        .photo-btn.has-photo {
            color: #10b981;
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }
        .photo-thumbnail {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .photo-thumbnail.show { display: block; }
        
        /* Comment Button Active Style */
        .comment-btn.has-comment {
            color: #10b981;
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }

        /* Network Status Indicator */
        .network-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.8);
            padding: 2px 8px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
            margin-top: 0.5rem;
            margin-left: auto;
            width: fit-content;
        }
        .dark .network-status { background: rgba(0,0,0,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #10b981; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media print {
            body { padding-bottom: 0; }
            header, .mb-6.bg-white, nav, #footerStatus, .modal-overlay, .actions, button, a[href^="tel"], .controls-area, .photo-controls, #mainSubmitSection, .network-status {
                display: none !important;
            }
            .print-value { display: block !important; }
            main, section, .card { display: block !important; box-shadow: none !important; border: none !important; }
        }
        .print-value { display: none; font-weight: bold; }
        
        /* Table in modal */
        .preview-table td, .preview-table th {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
            color: #1e293b;
        }
        .dark .preview-table td, .dark .preview-table th { border-color: #444; }
        
        /* Error Highlight Styles */
        @keyframes errorPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); border-color: #ef4444; }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); border-color: #fca5a5; }
        }
        .error-highlight {
            animation: errorPulse 1.5s infinite;
            border: 2px solid #ef4444 !important;
            background-color: #fef2f2 !important;
            transition: background-color 0.3s ease;
        }
        .dark .error-highlight { background-color: rgba(239, 68, 68, 0.15) !important; }
    </style>
</head>

        // --- Custom Dialog System ---
        const showCustomDialog = (options) => {

        const customAlert = (msg) => showCustomDialog({ message: msg });
        const customConfirm = (msg) => showCustomDialog({ message: msg, isConfirm: true });

        // --- Clock Update ---
        const updateClock = () => {
            const dateEl = document.getElementById('current-date');
            if(dateEl) {
                const now = new Date();
                dateEl.textContent = now.toLocaleDateString('uk-UA') + ' ' + now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
            }
        };

        /* ────────────────────────── ВХІД ЗА PIN ──────────────────────────
           Зроблено так само, як у ЗІП (Spare-parts-mechanic-service), щоб
           обидва застосунки поводилися однаково.

           PIN живе тільки в кадровій таблиці, колонка Q. Змінити його
           з додатку не можна — ані собі, ані комусь. Забув або збігся
           з чужим — правиться в таблиці.

           Прізвище механіка більше не обирається зі списку: його дає вхід,
           і саме воно потрапляє у звіт. Підмінити автора неможливо —
           сервер бере ім'я з підтвердженої сесії, а не з запиту.          */

        const APP_VERSION    = 'checklist-client-2026-08-25';
        const CONFIG_VERSION = 'client-2026-08-25';
        const SESSION_KEY    = 'checklistSessionV1';
        const DEVICE_KEY     = 'checklistDeviceIdV1';
        const ACTIVITY_KEY   = 'checklistLastActivityV1';
        const UNLOCK_KEY     = 'checklistOfflineUnlockV1';

        /* Зміна триває 12 годин — стільки ж живе сесія.
           Простій 10 хвилин — привід перепитати PIN: телефон, забутий
           у роздягальні, не лишається відкритим чек-листом. Те саме число,
           що в ЗІП, щоб звичка була одна на два застосунки. */
        const IDLE_LIMIT_MS      = 10 * 60 * 1000;
        const OFFLINE_SESSION_MS = 12 * 60 * 60 * 1000;
        const UNLOCK_MAX_AGE_MS  = 7 * 24 * 60 * 60 * 1000;   // не довше тижня від входу онлайн
        const UNLOCK_ITERATIONS  = 150000;

        let session = null;
        let idleTimer = null;
        let lastActivityWrite = 0;
        /* Хук на зміну сесії: підставляє прізвище у поле механіка. Вхід буває
           не тільки на старті — ще й після простою, протухлої сесії й офлайн-
           розблокування, і в кожному з цих випадків прізвище треба оновити. */
        let onSessionChange = () => {};

        const getDeviceId = () => {
            let id = localStorage.getItem(DEVICE_KEY);
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                     : Date.now().toString(36) + Math.random().toString(36).slice(2);
                localStorage.setItem(DEVICE_KEY, id);
            }
            return id;
        };

        /* Свій Content-Type НЕ ставимо: тоді браузер шле text/plain, preflight
           не виникає — і відповідь можна прочитати. Саме через це старий
           клієнт із mode:'no-cors' ніколи не знав, чи звіт узагалі дійшов. */
        /* Помилки розрізняються навмисно. Раніше будь-який збій показувався як
           «немає мережі», і через це причину шукали тиждень: інтернет був,
           а браузер просто не міг прочитати відповідь. Тепер застосунок каже,
           що саме сталося. */
        const apiError = (kind, message) => {
            const e = new Error(message);
            e.kind = kind;
            return e;
        };

        const api = async (payload) => {
            if (!navigator.onLine) throw apiError('offline', 'Немає інтернету на пристрої.');
            let res;
            try {
                res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify(Object.assign({ deviceId: getDeviceId() }, payload))
                });
            } catch (e) {
                /* fetch падає і коли мережі немає, і коли Google не дав браузеру
                   прочитати відповідь. Друге буває, коли в розгортанні «Хто має
                   доступ» не «Усі»: замість даних приходить сторінка входу,
                   а її читати з чужого домену не можна. */
                throw apiError('blocked', navigator.onLine
                    ? 'Сервер не відповідає. Найчастіша причина — у розгортанні скрипта ' +
                      '«Хто має доступ» стоїть не «Усі».'
                    : 'Зв\'язок обірвався.');
            }
            if (!res.ok) {
                throw apiError('http', 'Сервер відповів помилкою HTTP ' + res.status +
                                       ' — скрипт розгорнуто, але він не спрацював.');
            }
            try {
                return await res.json();
            } catch (e) {
                throw apiError('badjson', 'Сервер повернув не дані, а сторінку. ' +
                                          'Схоже, розгортання вимагає входу в Google.');
            }
        };

        const loadSession = () => {
            try {
                const stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
                if (stored && stored.expiresAt > Date.now()) return stored;
            } catch (e) { /* зіпсований запис — вважаємо, що сесії немає */ }
            localStorage.removeItem(SESSION_KEY);
            return null;
        };
        const saveSession = (value) => {
            session = value;
            try { localStorage.setItem(SESSION_KEY, JSON.stringify(value)); } catch (e) {}
        };
        const dropSession = () => {
            session = null;
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        };

        /* ── локальне розблокування без мережі ──
           На пристрої лежить не PIN, а повільно обчислений перевірник.
           Це дає змогу заповнити чек-лист там, де немає зв'язку; справжній
           бар'єр — токен, який сервер перевіряє під час запису. */
        const toHex = (buffer) => Array.from(new Uint8Array(buffer))
            .map(b => b.toString(16).padStart(2, '0')).join('');

        const derivePinHash = async (pin, saltHex) => {
            const salt = Uint8Array.from(saltHex.match(/.{2}/g).map(p => parseInt(p, 16)));
            const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin),
                                                      'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt, iterations: UNLOCK_ITERATIONS, hash: 'SHA-256' }, key, 256);
            return toHex(bits);
        };

        const saveOfflineUnlock = async (pin, user) => {
            if (!window.crypto || !crypto.subtle) return;
            try {
                const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
                localStorage.setItem(UNLOCK_KEY, JSON.stringify({
                    salt, hash: await derivePinHash(pin, salt), verifiedAt: Date.now(), user: user
                }));
            } catch (e) { /* без крипто-API просто не буде офлайн-входу */ }
        };

        const tryOfflineUnlock = async (pin) => {
            if (!window.crypto || !crypto.subtle) return null;
            let record = null;
            try { record = JSON.parse(localStorage.getItem(UNLOCK_KEY) || 'null'); } catch (e) { return null; }
            if (!record || !record.salt) return null;
            if (Date.now() - record.verifiedAt > UNLOCK_MAX_AGE_MS) return null;
            try {
                return (await derivePinHash(pin, record.salt)) === record.hash ? record : null;
            } catch (e) { return null; }
        };

        /* ── автовихід через простій ──
           Мітка часу лежить у сховищі, тому простій переживає і перезавантаження
           сторінки, і закриття вкладки. */
        const autoLogout = (why) => {
            if (!session) return;
            dropSession();
            showLoginOverlay(why || 'Сесію завершено. Увійдіть за PIN.');
        };

        const markActivity = () => {
            if (!session) return;
            const now = Date.now();
            if (now - lastActivityWrite > 5000) {
                try { localStorage.setItem(ACTIVITY_KEY, String(now)); } catch (e) {}
                lastActivityWrite = now;
            }
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => autoLogout(
                'Сесію завершено через ' + (IDLE_LIMIT_MS / 60000) + ' хвилин бездіяльності. Увійдіть за PIN.'),
                IDLE_LIMIT_MS);
        };

        const isIdleExpired = () => {
            const last = Number(localStorage.getItem(ACTIVITY_KEY) || 0);
            return !!last && Date.now() - last > IDLE_LIMIT_MS;
        };

        const startIdleWatch = () => {
            ['click', 'keydown', 'touchstart', 'scroll'].forEach(type =>
                document.addEventListener(type, markActivity, { passive: true }));
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && session && isIdleExpired()) {
                    autoLogout('Сесію завершено через бездіяльність. Увійдіть за PIN.');
                }
            });
            markActivity();
        };

        /* ── екран входу ── */
        const setAuthError = (msg) => {
            const el = document.getElementById('authError');
            el.textContent = msg || '';
            el.classList.toggle('hidden', !msg);
        };

        /* Чекати на вхід може кілька місць одночасно (черга, відправка звіту,
           старт застосунку). Тримати ОДИН resolve не можна: наступний виклик
           затирав попередній, і той, хто чекав першим, зависав назавжди —
           разом із синхронізацією черги. */
        let loginWaiters = [];
        const showLoginOverlay = (message) => {
            const o = document.getElementById('authOverlay');
            o.classList.remove('hidden');
            o.classList.add('flex');
            document.getElementById('authPin').value = '';
            setAuthError(message || '');
            setTimeout(() => document.getElementById('authPin').focus(), 100);
        };
        const hideLoginOverlay = () => {
            const o = document.getElementById('authOverlay');
            o.classList.add('hidden');
            o.classList.remove('flex');
            document.getElementById('authPin').value = '';
        };

        const doLogin = async () => {
            const input = document.getElementById('authPin');
            const btn = document.getElementById('authLoginBtn');
            const pin = input.value.trim();
            if (!pin) { setAuthError('Введіть PIN'); return; }

            setAuthError('');
            btn.disabled = true; btn.textContent = 'Перевірка…';
            let data = null, offline = false;
            let lastApiError = null;
            try {
                data = await api({ action: 'login', pin: pin });
            } catch (e) {
                lastApiError = e;
                // сервера немає — пробуємо локальне розблокування
                const record = await tryOfflineUnlock(pin);
                if (record) { data = { ok: true, user: record.user }; offline = true; }
            }
            btn.disabled = false; btn.textContent = 'Увійти';
            input.value = '';

            if (!data) {
                setAuthError((lastApiError ? lastApiError.message : 'Сервер не відповідає.') +
                             ' Локальний вхід теж недоступний — спершу увійдіть один раз онлайн.');
                return;
            }
            if (!data.ok) { setAuthError(data.message || 'Невірний PIN'); return; }
            if (!data.user.can.mech) {
                setAuthError('Ваша роль не дає доступу до чек-листа механіка');
                return;
            }

            saveSession({
                token: offline ? '' : data.token,
                user: data.user,
                expiresAt: offline ? (Date.now() + OFFLINE_SESSION_MS)
                                   : (data.expires_at || Date.now() + OFFLINE_SESSION_MS),
                offline: offline
            });
            if (!offline) saveOfflineUnlock(pin, data.user);   // 150 000 ітерацій — рахуємо у фоні

            hideLoginOverlay();
            startIdleWatch();
            onSessionChange();
            if (offline) {
                customAlert('Зв\'язку немає. Чек-лист можна заповнити — звіт піде, щойно ' +
                            'з\'явиться інтернет і ви увійдете онлайн.');
            }
            const waiters = loginWaiters;
            loginWaiters = [];
            waiters.forEach(function (fn) { try { fn(); } catch (e) {} });
        };

        /** Показує екран входу і чекає, доки не увійдуть. */
        const requireLogin = (message) => new Promise((resolve) => {
            loginWaiters.push(resolve);
            showLoginOverlay(message);
        });

        /** Сервер сказав, що сесії немає: стираємо і просимо PIN. */
        const handleAuthFailure = (message) => {
            dropSession();
            return requireLogin(message || 'Сесію завершено. Увійдіть за PIN.');
        };

        /**
         * Повертає, коли на пристрої є дійсна сесія механіка.
         * Онлайн — звіряємо з сервером: звільнення або зміна ролі мають
         * подіяти одразу, а не після закінчення сесії.
         */
        const bootAuth = async () => {
            session = loadSession();
            if (session && isIdleExpired()) { dropSession(); }

            if (session) {
                if (!session.offline && session.token) {
                    let r = null;
                    try { r = await api({ action: 'whoami', token: session.token }); }
                    catch (e) { r = null; }                       // зв'язку немає — довіряємо сесії

                            dropSession();
                            return requireLogin('Ваша роль більше не дає доступу до чек-листа механіка');
                        }
                        saveSession(Object.assign({}, session, { user: r.user }));
                        onSessionChange();
                    } else if (r) {
                        dropSession();
                    }
                }
            }
            if (session) { hideLoginOverlay(); startIdleWatch(); return; }
            return requireLogin();

            const kyivDate = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Kyiv' }).format(new Date());

            /* Ідентифікатор звіту робиться ОДИН раз і подорожує разом зі звітом

               дубль — тому мережевий збій більше не множить звіти. */
            const makeReportId = (bizDate, stage) => {
                const st = stage === 'Кінець зміни' ? 'end' : 'start';
                let rnd = '';
                if (window.crypto && crypto.getRandomValues) {
                    rnd = Array.from(crypto.getRandomValues(new Uint8Array(3)))
                        .map(b => b.toString(16).padStart(2, '0')).join('');
                } else {
                    rnd = Math.random().toString(16).slice(2, 8);
                }
                return `${bizDate}_mech_${st}_${rnd}`;
            };

               Порожнє поле лишається порожнім рядком на своєму місці. */
            const readItemValue = (el, cfg) => {
                const type = el.dataset.type;
                if (type === 'dual_input' || type === 'triple_input') {
                    return { value: el.dataset.value || '', values: fieldInputs(el).map(i => i.value.trim()) };
                }

                    const inp = el.querySelector('[data-input]');
                    const raw = inp ? inp.value.trim() : (el.dataset.value || '');
                    return { value: raw, values: (cfg && cfg.numeric && raw) ? [raw] : [] };

                document.getElementById('mainSubmitBtn').addEventListener('click', () => showCompletionModal(currentSection));

            const handlePhotoUpload = (input, item, uniqueId) => {
                if (!employeeSelect.value) { 
                    customAlert("Спочатку оберіть механіка зі списку зверху!"); 
                    input.value = ''; 
                    return; 
                }
                
                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    const reader = new FileReader();
                    setPhotoBusy(1);
                    reader.onerror = function () {
                        setPhotoBusy(-1);
                        customAlert('Не вдалося прочитати фото. Спробуйте зняти ще раз.');
                    };
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.getElementById('compressionCanvas');
                            const ctx = canvas.getContext('2d');
                            const MAX_WIDTH = 800;
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            currentPhotos[uniqueId] = dataUrl;
                            
                            const thumb = item.querySelector('.photo-thumbnail');
                            thumb.src = dataUrl;
                            thumb.classList.remove('hidden');
                            thumb.classList.add('show');
                            item.querySelector('.photo-btn').classList.add('has-photo');
                            item.classList.remove('error-highlight');
                            setPhotoBusy(-1);
                        };
                        img.onerror = function () {
                            setPhotoBusy(-1);
                            customAlert('Файл не схожий на зображення.');
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const attachItemListeners = () => {
                const items = document.querySelectorAll('.checklist-item');
                
                // Event listener for tooltip buttons
                const tooltipBtns = document.querySelectorAll('.tooltip-btn');
                tooltipBtns.forEach(btn => {

                        e.stopPropagation(); // Щоб не спрацьовували інші кліки на елементі
                        const configId = btn.getAttribute('data-tooltip-id');
                        let foundItem = null;
                        checklistConfig.forEach(g => {
                            const found = g.items.find(i => i.id === configId);
                            if(found) foundItem = found;
                        });

                        if(foundItem) {

                                    html: true,

                    if(photoInput) photoInput.addEventListener('change', () => handlePhotoUpload(photoInput, item, id));

                    item.querySelector('.comment-btn').addEventListener('click', () => openCommentModal(item));

                    if (type === 'binary') {
                        const btns = item.querySelectorAll('.option-btn');
                        btns.forEach(btn => {
                            btn.addEventListener('click', () => {
                                if (!employeeSelect.value) { customAlert("Спочатку оберіть механіка!"); return; }
                                btns.forEach(b => b.classList.remove('selected-good', 'selected-bad', 'selected-neutral'));

                                item.classList.remove('error-highlight');
                                item.dataset.value = btn.dataset.val;
                                item.querySelector('.print-value').textContent = `Обрано: ${btn.dataset.val}`;

                                updateProgress();
                            });
                        });
                    } else if (type === 'input') {
                        const input = item.querySelector('input');
                        input.addEventListener('input', () => {
                             if (!employeeSelect.value) { input.blur(); customAlert("Спочатку оберіть механіка!"); return; }

                                 item.classList.add('completed');
                                 item.classList.remove('error-highlight');
                                 item.dataset.value = input.value;
                                 item.querySelector('.print-value').textContent = `Значення: ${input.value}`;
                             } else {
                                 item.classList.remove('completed');
                                 delete item.dataset.value;
                                 item.querySelector('.print-value').textContent = '';
                             }
                             saveState();
                             updateProgress();
                        });
                    } else if (type === 'dual_input' || type === 'triple_input') {
                        const inputs = fieldInputs(item);

                        const handleMultiChange = () => {
                            if (!employeeSelect.value) { inputs.forEach(i => i.blur()); customAlert("Спочатку оберіть механіка!"); return; }
                            const vals = inputs.map(i => i.value.trim());

                            if (vals.some(v => v)) {
                                item.classList.add('completed');
                                item.classList.remove('error-highlight');
                                const displayStr = inputs.map((i, k) => `${i.placeholder}: ${vals[k] || '-'}`).join(' / ');
                                item.dataset.value = displayStr;
                                item.querySelector('.print-value').textContent = displayStr;
                            } else {
                                item.classList.remove('completed');
                                delete item.dataset.value;
                                item.querySelector('.print-value').textContent = '';
                            }
                            saveState();
                            updateProgress();
                        };

                        inputs.forEach(i => i.addEventListener('input', handleMultiChange));
                    }
                });
            };

            let currentCommentItem = null;
            const openCommentModal = (item) => {
                currentCommentItem = item;
                commentTextarea.value = item.querySelector('.comment-text').textContent;
                commentModal.style.display = 'flex';
            };
            
            const saveCommentBtn = document.getElementById('saveCommentBtn');
            if(saveCommentBtn) {
                saveCommentBtn.addEventListener('click', () => {
                    if (currentCommentItem) {
                        const commentEl = currentCommentItem.querySelector('.comment-text');
                        const newComment = commentTextarea.value.trim();
                        commentEl.textContent = newComment;
                        commentEl.classList.toggle('hidden', !newComment);
                        
                        const cBtn = currentCommentItem.querySelector('.comment-btn');
                        if(newComment) cBtn.classList.add('has-comment');
                        else cBtn.classList.remove('has-comment');

                        saveState();
                    }
                    commentModal.style.display = 'none';
                });
            }

            const cancelCommentBtn = document.getElementById('cancelCommentBtn');
            if(cancelCommentBtn) {
                cancelCommentBtn.addEventListener('click', () => commentModal.style.display = 'none');
            }

            const saveState = () => {
                const state = {
                    checklist: {},
                    employee: employeeSelect.value,
                    theme: document.body.classList.contains('dark') ? 'dark' : 'light'
                };
                document.querySelectorAll('.checklist-item').forEach(item => {
                    state.checklist[item.id] = {
                        completed: item.classList.contains('completed'),
                        value: item.dataset.value || '',
                        comment: item.querySelector('.comment-text').textContent
                    };
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            };

            const loadState = () => {
                const savedState = localStorage.getItem(STORAGE_KEY);
                if (savedState) {
                    try {
                        appState = JSON.parse(savedState);
                        if (appState.employee) employeeSelect.value = appState.employee;
                        if (appState.theme === 'dark') document.body.classList.add('dark');
                    } catch(e) {
                        console.error("Local storage read error", e);
                    }
                }
            };
            
            const restoreDOMState = () => {
                if(!appState.checklist) return;
                Object.keys(appState.checklist).forEach(id => {
                    const el = document.getElementById(id);
                    if(el) {
                        const data = appState.checklist[id];
                        if (data.completed) el.classList.add('completed');
                        if (data.value) {
                            el.dataset.value = data.value;
                            if(el.dataset.type === 'binary') {
                                const btn = Array.from(el.querySelectorAll('.option-btn')).find(b => b.dataset.val === data.value);
                                if(btn) {
                                    if(btn.dataset.kind === 'good') btn.classList.add('selected-good');
                                    else if(btn.dataset.kind === 'bad') btn.classList.add('selected-bad');
                                    else btn.classList.add('selected-neutral');
                                }
                                el.querySelector('.print-value').textContent = `Обрано: ${data.value}`;
                            } else if(el.dataset.type === 'input') {
                                const inp = el.querySelector('input');
                                if(inp) inp.value = data.value;
                                el.querySelector('.print-value').textContent = `Значення: ${data.value}`;
                            } else if (el.dataset.type === 'dual_input' || el.dataset.type === 'triple_input') {
                                const parts = data.value.split(' / ');
                                fieldInputs(el).forEach((inp, k) => {
                                    const raw = parts[k] ? parts[k].split(': ')[1] : '';
                                    inp.value = (raw === undefined || raw === '-') ? '' : raw;
                                });
                                el.querySelector('.print-value').textContent = data.value;
                            }
                        }
                        if (data.comment) {
                            const cEl = el.querySelector('.comment-text');
                            cEl.textContent = data.comment;
                            cEl.classList.remove('hidden');
                            el.querySelector('.comment-btn').classList.add('has-comment');
                        }
                    }
                });
                updateProgress();
            };

            const updateProgress = () => {
                if(currentSection === 'contacts') return;
                const items = document.querySelectorAll(`#${currentSection}ShiftSection .checklist-item`);
                const completedCount = document.querySelectorAll(`#${currentSection}ShiftSection .checklist-item.completed`).length;
                const total = items.length;
                const percentage = total > 0 ? (completedCount / total) * 100 : 0;
                
                document.getElementById('currentProgressBar').style.width = `${percentage}%`;
                document.getElementById('currentStatus').textContent = `Залишилось завдань: ${total - completedCount}`;
            };

            const clearSectionData = (sectionId) => {
                const items = document.querySelectorAll(`#${sectionId}ShiftSection .checklist-item`);
                items.forEach(item => {
                    item.classList.remove('completed');
                    delete item.dataset.value;
                    item.querySelector('.comment-text').textContent = '';
                    item.querySelector('.comment-text').classList.add('hidden');
                    item.querySelector('.print-value').textContent = '';
                    item.querySelector('.comment-btn').classList.remove('has-comment');
                    
                    const thumb = item.querySelector('.photo-thumbnail');
                    if(thumb) { thumb.src = ''; thumb.classList.add('hidden'); }
                    const pBtn = item.querySelector('.photo-btn');
                    if(pBtn) pBtn.classList.remove('has-photo');
                    
                    const pInput = item.querySelector('.photo-input');
                    if(pInput) pInput.value = '';
                    
                    delete currentPhotos[item.id];
                    
                    if(item.dataset.type === 'binary') {
                        item.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected-good', 'selected-bad', 'selected-neutral'));
                    } else if(item.dataset.type === 'input') {
                        const i = item.querySelector('input');
                        if(i) i.value = '';
                    } else if(item.dataset.type === 'dual_input' || item.dataset.type === 'triple_input') {
                        fieldInputs(item).forEach(i => { i.value = ''; });
                    }
                });
                saveState();
                updateProgress();
            };

            const updateNetworkStatus = () => {
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
                
                if (!navigator.onLine) {
                    dot.className = 'status-dot offline';
                    text.textContent = `Офлайн (${queue.length})`;
                } else if (queue.length > 0) {
                    dot.className = 'status-dot offline';
                    text.textContent = `Черга (${queue.length})`;
                } else {
                    dot.className = 'status-dot online';
                    text.textContent = 'Онлайн';
                }
            };

            /* Повертає false, якщо звіт не вліз у сховище браузера. Мовчазна
               відмова тут означала б утрачений звіт, тому виклик перевіряється. */
            const saveReportOffline = (reportData) => {
                try {
                    const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
                    queue.push(reportData);
                    localStorage.setItem(OFFLINE_KEY, JSON.stringify(queue));
                    updateNetworkStatus();
                    return true;
                } catch (e) {
                    console.error('offline queue full', e);
                    return false;
                }
            };

            /* Прапорець проти повторного входу: подія «online» і натискання на
               індикатор мережі можуть трапитися одночасно, і тоді два прогони
               читають ту саму чергу — звіт іде двічі, а запис у localStorage
               наприкінці воскрешає вже відправлений. */
            let syncingQueue = false;

            const processOfflineQueue = async () => {
                if (syncingQueue) return;
                const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
                if (queue.length === 0) return;
                syncingQueue = true;

                const statusDot = document.getElementById('statusDot');
                statusDot.className = 'status-dot syncing';
                document.getElementById('statusText').textContent = 'Синхронізація...';

                const newQueue = [];
                let sent = 0, refused = 0, lastMsg = '', needLogin = false, foreign = 0;
                try {
                const me = (session && session.user) ? session.user.user_id : '';
                for (const report of queue) {
                    if (report._author && me && report._author !== me) {
                        // чужий звіт: сервер підписав би його тим, хто зараз у сесії
                        newQueue.push(report);
                        foreign++;
                        continue;
                    }
                    let res = null;
                    try {
                        // токен беремо ПОТОЧНИЙ: той, що був у мить збереження,
                        // міг застаріти, поки звіт лежав у черзі
                        const body = Object.assign({}, report, { token: sessionToken() });
                        delete body._author;                       // це суто локальна позначка
                        res = await api(body);
                    } catch (e) {
                        res = null;
                        lastMsg = e.message || '';
                    }
                    if (res && (res.ok || res.duplicate)) { sent++; continue; }
                    if (res && !res.ok) {
                        refused++;
                        lastMsg = res.message || res.error || '';
                        if (res.error === 'AUTH') needLogin = true;
                    }
                    newQueue.push(report);   // відхилений звіт лишається в черзі
                }

                localStorage.setItem(OFFLINE_KEY, JSON.stringify(newQueue));
                updateNetworkStatus();

                if (sent && !newQueue.length) {
                    customAlert(`Збережені звіти відправлено: ${sent}`);
                } else if (foreign && !refused) {
                    customAlert(`На цьому пристрої чекає ${foreign} звіт(ів), складених іншим працівником.\n\n` +
                                'Вони підуть, коли ця людина увійде за своїм PIN.');
                } else if (needLogin) {
                    // НЕ чекаємо на вхід: інакше синхронізація застрягає до
                    // перезавантаження сторінки, бо прапорець syncingQueue
                    // лишається піднятим, поки людина дивиться на екран входу
                    handleAuthFailure('Увійдіть за PIN, щоб надіслати збережені звіти — вони на місці.');
                } else if (refused) {
                    customAlert(`Сервер не прийняв ${refused} звіт(ів) із черги: ${lastMsg}\n\nЗвіти залишилися на пристрої.`);
                } else if (newQueue.length && lastMsg) {
                    customAlert(`Звіти не пішли: ${lastMsg}\n\nВони залишилися на пристрої — ` +
                                'нічого не втрачено, надішлються, щойно все запрацює.');
                }
                } finally {
                    syncingQueue = false;
                }
            };

            window.addEventListener('online', () => {
                updateNetworkStatus();
                processOfflineQueue();
            });
            window.addEventListener('offline', updateNetworkStatus);
            document.getElementById('networkStatusBtn').addEventListener('click', processOfflineQueue);

            const switchView = (view) => {
                currentSection = view;
                document.getElementById('contactsSection').classList.add('hidden');
                document.getElementById('footerStatus').style.display = 'flex';
                document.getElementById('startShiftBtn').classList.remove('active');
                document.getElementById('endShiftBtn').classList.remove('active');

                if (view === 'contacts') {
                    checklistContainer.classList.add('hidden');
                    document.getElementById('contactsSection').classList.remove('hidden');
                    document.getElementById('footerStatus').style.display = 'none';
                } else {
                    checklistContainer.classList.remove('hidden');
                    renderChecklist(view);
                    restoreDOMState();
                    if(view === 'start') document.getElementById('startShiftBtn').classList.add('active');
                    else document.getElementById('endShiftBtn').classList.add('active');
                    updateProgress();
                }
            };

            const showCompletionModal = (section) => {
                if (!employeeSelect.value) { customAlert("Спочатку оберіть механіка!"); return; }
                const modal = document.getElementById('completionModal');
                
                const items = Array.from(document.querySelectorAll(`#${section}ShiftSection .checklist-item`));
                let tableHtml = '<table class="preview-table w-full"><thead><tr><th>Питання</th><th>Статус / Відповідь</th></tr></thead><tbody>';
                
                let allCompleted = true;
                let incompleteItems = [];

                items.forEach(item => {
                    const text = item.querySelector('.task-text').textContent;
                    
                    const uniqueId = item.id;
                    const configId = uniqueId.replace(`${section}-`, '');
                    let isPhotoRequired = false;
                    checklistConfig.forEach(g => {
                        const cfgItem = g.items.find(i => i.id === configId);
                        if (cfgItem && cfgItem.photoRequired) isPhotoRequired = true;
                    });

                    const isFilled = item.classList.contains('completed');
                    const hasPhoto = !!currentPhotos[uniqueId];
                    
                    let isItemValid = isFilled;
                    if (isPhotoRequired && !hasPhoto) isItemValid = false;

                    if (!isItemValid) {
                        allCompleted = false;
                        incompleteItems.push(text);
                        item.classList.add('error-highlight');
                    } else {
                        item.classList.remove('error-highlight');
                    }

                    let valDisplay = item.dataset.value || '';
                    if (!isFilled) valDisplay = '<span class="text-red-500 font-bold">Не заповнено</span>';
                    else if (isPhotoRequired && !hasPhoto) valDisplay = `<span class="text-red-500 font-bold">${valDisplay} (Бракує фото)</span>`;
                    
                    const photoIcon = hasPhoto ? '📷' : '';
                    tableHtml += `<tr><td class="${!isItemValid ? 'text-red-600 font-medium' : ''}">${text}</td><td>${valDisplay} ${photoIcon}</td></tr>`;
                });
                tableHtml += '</tbody></table>';
                
                document.getElementById('previewContent').innerHTML = tableHtml;
                
                const msgEl = document.getElementById('modalMessage');
                if (allCompleted) {
                    msgEl.innerHTML = 'Попередній перегляд звіту <span class="block text-sm text-green-600 font-normal mt-1">Всі пункти заповнено коректно!</span>';
                } else {
                    msgEl.innerHTML = 'Попередній перегляд звіту <span class="block text-sm text-red-600 font-bold mt-1">Увага! Є незаповнені пункти.</span>';
                }

                modal.style.display = 'flex';
                
                const btn = document.getElementById('submitReportBtn');
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                
                if (allCompleted) {
                    newBtn.textContent = 'Підтвердити та Відправити';
                    newBtn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors w-full';
                    newBtn.addEventListener('click', () => submitReport(section));
                } else {
                    newBtn.textContent = 'Заповнити пропущені пункти';
                    newBtn.className = 'bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors animate-pulse w-full';
                    newBtn.addEventListener('click', () => {
                        modal.style.display = 'none';
                        customAlert(`Ви пропустили ${incompleteItems.length} пунктів (або не додали обов'язкове фото)! Будь ласка, заповніть їх (вони підсвічені червоним та блимають).`);
                        
                        setTimeout(() => {
                            const firstInvalid = document.querySelector('.error-highlight');
                            if (firstInvalid) {
                                firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }, 300);
                    });
                }
            };

            const submitReport = async (section) => {
                if (photoBusy > 0) { customAlert('Зачекайте, фото ще обробляються.'); return; }

                const btn = document.getElementById('submitReportBtn');
                const status = document.getElementById('submitStatus');
                btn.disabled = true;
                btn.textContent = 'Відправка...';
                status.classList.remove('hidden');
                status.textContent = 'Обробка даних...';
                status.className = 'mt-2 text-sm text-blue-600 font-bold';

                const payload = buildPayload(section);
                const shortName = employeeSelect.value.split(' ')[1] || employeeSelect.value;
                // локальна позначка: ім'я автора на сервер не йде, але звіт,
                // складений у чергу однією людиною, не має піти від імені
                // наступної, яка увійде на цьому ж телефоні
                payload._author = (session && session.user) ? session.user.user_id : '';

                const reset = () => {
                    btn.disabled = false;
                    btn.textContent = 'Підтвердити та Відправити';
                    status.classList.add('hidden');
                };
                const finish = (text, cls, alertText) => {
                    status.textContent = text;
                    status.className = 'mt-2 text-sm font-bold ' + cls;
                    setTimeout(() => {
                        document.getElementById('completionModal').style.display = 'none';
                        reset();
                        if (alertText) customAlert(alertText);
                    }, 1000);
                };
                const queueIt = (why) => {
                    if (saveReportOffline(payload)) {
                        clearSectionData(section);
                        finish('Збережено офлайн!', 'text-orange-600',
                               `${why}\nЗвіт збережено на пристрої і піде сам, щойно з'явиться зв'язок.\n\n${shortName}, щиро дякуємо за ваш сумлінний труд! Бажаємо хорошого робочого дня! 🛠️`);
                    } else {
                        // сховище браузера переповнене — очищати форму НЕ МОЖНА
                        reset();
                        status.classList.remove('hidden');
                        status.textContent = '❌ Не вистачає місця на пристрої';
                        status.className = 'mt-2 text-sm text-red-600 font-bold';
                        customAlert('Пам\'ять браузера переповнена, звіт не збережено.\n\nВідправте раніше збережені звіти (кнопка статусу мережі вгорі) або приберіть частину фото — і спробуйте ще раз. Заповнене нікуди не зникло.');
                    }
                };

                if (!navigator.onLine) { queueIt('Відсутній інтернет.'); return; }
                if (session && session.offline) { queueIt('Ви увійшли без зв\'язку.'); return; }

                let res = null;
                try {
                    const body = Object.assign({ token: sessionToken() }, payload);
                    delete body._author;                       // суто локальна позначка
                    res = await api(body);
                } catch (e) {
                    console.error(e);
                    // причину показуємо як є: «немає мережі» на все підряд збиває з пантелику
                    queueIt(e.message || 'Не вдалося достукатися до сервера.');
                    return;
                }

                // ── сервер відповів; тепер ми ЗНАЄМО, що сталося зі звітом ──
                if (res && (res.ok || res.duplicate)) {
                    clearSectionData(section);          // очищаємо ТІЛЬКИ після підтвердження
                    const warn = (res.warnings && res.warnings.length)
                        ? '\n\nУвага: ' + res.warnings.join('; ') : '';
                    finish('✅ Успішно! Звіт відправлено.', 'text-green-600',
                           `Звіт успішно відправлено!${warn}\n\n${shortName}, щиро дякуємо за ваш сумлінний труд! Бажаємо хорошого робочого дня! 🛠️`);
                    return;
                }

                // Відмова сервера — черга не допоможе, дані лишаємо у формі
                reset();
                status.classList.remove('hidden');
                status.textContent = '❌ ' + (res.message || res.error || 'Сервер відхилив звіт');
                status.className = 'mt-2 text-sm text-red-600 font-bold';

                if (res.error === 'AUTH') {
                    await handleAuthFailure('Сесія завершилася. Увійдіть за PIN — заповнене нікуди не зникло.');
                } else {
                    customAlert('Звіт не прийнято: ' + (res.message || res.error || 'невідома помилка') +
                                '\n\nЗаповнене залишилося у формі — виправте і спробуйте ще раз.');
                }
            };
            
            document.getElementById('footerStatus').addEventListener('click', () => {
                if(currentSection !== 'contacts') showCompletionModal(currentSection);
            });

            // Прізвище механіка більше не обирається зі списку — його дає вхід за PIN.
            // Змінити PIN із застосунку не можна: він живе в кадровій таблиці.
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', async () => {
                const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
                const warn = queue.length
                    ? `\n\nУвага: ${queue.length} звіт(ів) ще не відправлено. Вони залишаться на пристрої до наступного входу.`
                    : '';
                if (await customConfirm('Вийти із застосунку?' + warn)) {
                    dropSession();
                    location.reload();
                }
            });
            
            const themeToggleBtn = document.getElementById('themeToggle');
            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark');
                    saveState();
                });
            }
            
            const printBtn = document.getElementById('printBtn');
            if(printBtn) {
                printBtn.addEventListener('click', () => window.print());
            }
            
            const closeModalBtn = document.getElementById('closeModalBtn');
            if(closeModalBtn) {
                closeModalBtn.addEventListener('click', () => completionModal.style.display = 'none');
            }
            
            const startShiftBtn = document.getElementById('startShiftBtn');
            if(startShiftBtn) startShiftBtn.addEventListener('click', () => switchView('start'));
            
            const endShiftBtn = document.getElementById('endShiftBtn');
            if(endShiftBtn) endShiftBtn.addEventListener('click', () => switchView('end'));
            
            const contactsBtnHeader = document.getElementById('contactsBtnHeader');
            if(contactsBtnHeader) contactsBtnHeader.addEventListener('click', () => switchView('contacts'));

            /* Після вдалого входу черга має піти САМА. Раніше вона чекала
               перезавантаження сторінки або натискання на індикатор мережі —
               а це рівно той випадок, коли звіти зависли, людина увійшла
               і думає, що все надіслалося. Офлайн-сесію не чіпаємо: без
               справжнього токена сервер однаково відмовить. */
            onSessionChange = () => {
                applySession();
                if (sessionToken()) processOfflineQueue();
            };
            document.getElementById('authLoginBtn').addEventListener('click', doLogin);
            document.getElementById('authPin').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doLogin();
            });

            loadState();
            updateNetworkStatus();

            await bootAuth();      // тут застосунок чекає, доки не увійдуть за PIN
            applySession();

            switchView('start');
            processOfflineQueue();
        });
    </script>
</body>
</html>
